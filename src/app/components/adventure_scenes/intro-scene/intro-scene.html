<div class="w-full h-full relative">
  @if (isLoading()) {
    <app-loading-screen [label]="config()?.loadingLabel ?? 'Wird geladen...'" />
  } @else if (config(); as c) {
    <app-animation-object
      Name="world-intro"
      [Duration]="c.duration"
      [spritePaths]="c.frames"
      [contain]="false"
    ></app-animation-object>
  }
</div>
